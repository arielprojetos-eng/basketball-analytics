name: Coletor de basquete

on:
  schedule:
    # Coleta completa + backtest: 4 vezes por dia (UTC).
    - cron: "17 2,8,14,20 * * *"
    # Ao vivo: placares parciais (com quartos) na agenda, para o painel calcular as chances sozinho.
    # O agendador dispara a cada 10 min; o coletor só chama a API quando o intervalo mínimo do plano
    # passou (collector/config.json, apisports.plans): gratuito 30 min, pago 10 min. As execuções
    # intermediárias do plano gratuito terminam sem gastar cota.
    # O repositório é público, então os minutos do Actions são ilimitados. Se ele virar PRIVADO, volte
    # para "*/30 * * * *" (nas três ocorrências deste arquivo): a cada 10 min seriam ~4.300 min/mês,
    # acima dos 2.000 grátis, e o GitHub pararia também a coleta completa.
    - cron: "*/10 * * * *"
    # Odds de Over/Under: a API atualiza uma vez por dia, então uma coleta diária basta.
    - cron: "40 15 * * *"
  # Roda as odds quando o coletor de odds muda (primeira execução e conferência após ajustes).
  push:
    branches: [main]
    paths: ["collector/odds.py"]
  workflow_dispatch:
    inputs:
      modo:
        description: "completa, aovivo ou odds"
        required: false
        default: "completa"
      max_calls:
        description: "Máximo de chamadas à API nesta execução (coleta completa)"
        required: false
        default: "30"

jobs:
  coletar:
    if: github.event_name != 'push' && github.event.schedule != '*/10 * * * *' && github.event.schedule != '40 15 * * *' && github.event.inputs.modo != 'aovivo' && github.event.inputs.modo != 'odds'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: coletor
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - run: pip install -r collector/requirements.txt
      - name: Testes
        run: python -m unittest collector.tests.test_collector collector.tests.test_apisports collector.tests.test_model
      - name: Coletar
        env:
          BASKETBALL_API_KEY: ${{ secrets.BASKETBALL_API_KEY }}
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          MAX_CALLS: ${{ github.event.inputs.max_calls }}
        run: |
          if [ -n "$MAX_CALLS" ]; then
            python -m collector.main run --max-calls "$MAX_CALLS"
          else
            python -m collector.main run
          fi

  aovivo:
    if: github.event.schedule == '*/10 * * * *' || github.event.inputs.modo == 'aovivo'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: coletor-aovivo
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - run: pip install -r collector/requirements.txt
      - name: Testes
        run: python -m unittest collector.tests.test_collector collector.tests.test_apisports collector.tests.test_model
      - name: Placar ao vivo
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python -m collector.main run --only live

  odds:
    if: github.event.schedule == '40 15 * * *' || github.event_name == 'push' || github.event.inputs.modo == 'odds'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: coletor-odds
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - run: pip install -r collector/requirements.txt
      - name: Testes
        run: python -m unittest collector.tests.test_collector collector.tests.test_apisports collector.tests.test_model
      - name: Agenda atualizada (temporada de cada liga, exigida pelas odds)
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python -m collector.main run --only live --force --max-calls 1
      - name: Odds de Over/Under
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python -m collector.main run --only odds
