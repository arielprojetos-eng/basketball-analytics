name: Coletor de basquete

on:
  schedule:
    # 4 execuções por dia (UTC). Cada API gratuita tem 100 chamadas/dia, controladas separadamente.
    - cron: "17 2,8,14,20 * * *"
  workflow_dispatch:
    inputs:
      max_calls:
        description: "Máximo de chamadas à API nesta execução"
        required: false
        default: "30"

concurrency:
  group: coletor
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - run: pip install -r collector/requirements.txt
      - name: Testes
        run: python -m unittest collector.tests.test_collector collector.tests.test_apisports
      - name: Coletar
        env:
          BASKETBALL_API_KEY: ${{ secrets.BASKETBALL_API_KEY }}
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          MAX_CALLS: ${{ github.event.inputs.max_calls }}
        run: |
          if [ -n "$MAX_CALLS" ]; then
            python -m collector.main run --max-calls "$MAX_CALLS"
          else
            python -m collector.main run
          fi
