name: Descompactar projeto

on:
  push:
    paths: ["projeto.zip"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  descompactar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair o zip e versionar os arquivos
        run: |
          test -f projeto.zip || exit 0
          unzip -o projeto.zip -x ".github/*"
          git rm -q projeto.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Código do projeto"
          git push
